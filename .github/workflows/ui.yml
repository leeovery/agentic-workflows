# UI test lanes — phase-0 §7 (CI skeleton). Runs on every commit touching
# ui/**; never touches the product's own npm test gates.
name: ui

on:
  push:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          # The version handshake and spine tests read git history/tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
